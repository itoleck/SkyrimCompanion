[workspace]
resolver = "2"
members = ["crates/protocol", "crates/companion", "crates/mock-skse", "crates/map-extract"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
protocol = { path = "crates/protocol" }

[profile.release]
lto = "thin"
